# Update pull requests for the .NET SDK in global.json, the pinned workflow actions, the NuGet packages and both websites'
# npm packages, one grouped pull request per ecosystem (security updates come at once and on their own). Versions of
# actions and packages are proposed only once they are a week old: a hijacked release is usually found and pulled
# within days. The SDK has no wait, since it comes from Microsoft and carries security fixes.
# They are notices, not merge buttons: a commit merged on GitHub has no version raise and fails "Version raised" on main.
# Make the change locally instead (CONTRIBUTING, "Dependency updates"); Dependabot closes its pull request once main has it.
# A new SDK ships a new runtime and a NuGet package a new version: both fail EveryShippedPackageHasItsLicense until
# licenses.json and THIRD-PARTY-NOTICES.md name the new version.
version: 2
updates:
  # Weekly: a new SDK carries the month's runtime security fixes, which the exe ships.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: [ "*" ]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: [ "*" ]
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      website:
        patterns: [ "*" ]
  - package-ecosystem: npm
    directory: /website-v2
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      website-v2:
        patterns: [ "*" ]
