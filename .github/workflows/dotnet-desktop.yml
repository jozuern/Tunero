# Build, test and publish Tunero (WPF, .NET 10, Windows x64).
# Runs the unit tests (sandbox registry and fakes; nothing on the runner is changed) and the docs lint,
# then publishes the single self-contained exe and keeps it as a build artifact.
# Tests marked Category=Hardware read the real PC (Store apps, sensors, GPU driver) and only make sense on a
# gaming PC, not on the Windows Server runner: they are skipped here.
# Actions are pinned to commit SHAs; to update one, look up the new tag's commit (gh api repos/<action>/commits/<tag> --jq .sha).

name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the older run. On main every push runs to the end: the version check covers
# only the commits of its own push, so a cancelled run would leave those commits unchecked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false

    # Every commit on main raises the patch version (.githooks/pre-commit); a commit made without the hook fails here.
    # All commits of the push are checked, not only the last: a push of several commits can carry one without the hook.
    # Dependabot's commits and merge commits made on GitHub (the merge button) cannot run the hook: they may keep the
    # version but never lower it, and the next local commit raises it. Every other commit a merge brings in is checked
    # on its own, so a commit of yours merged through the button still needs the hook.
    - name: Version raised
      if: github.event_name == 'push'
      shell: pwsh
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        $csproj = "src/Optimizer.App/Optimizer.App.csproj"
        $dependabot = '49699333+dependabot[bot]@users.noreply.github.com'
        function Version($commit) { if (((git show "${commit}:$csproj" 2>$null) -join "`n") -match '<Version>([0-9.]+)</Version>') { $Matches[1] } }
        # A new branch or a forced push has no usable "before": then the last commit only.
        $known = $env:BEFORE -and $env:BEFORE -notmatch '^0+$' -and (git cat-file -t $env:BEFORE 2>$null) -eq 'commit'
        $commits = if ($known) { git rev-list "$($env:BEFORE)..HEAD" } else { git rev-parse HEAD }
        foreach ($commit in $commits) {
          $now = Version $commit
          # Every parent: a merge commit whose sides both raised the version to the same number keeps one of them.
          $parents = @((git rev-list --parents -n 1 $commit) -split ' ' | Select-Object -Skip 1)
          $author, $committer = (git log -1 --format='%ae%n%ce' $commit)
          $mayKeep = $author -eq $dependabot -or ($parents.Count -gt 1 -and $committer -eq 'noreply@github.com')
          foreach ($parent in $parents) {
            $before = Version $parent
            if (-not $before) { continue }
            if ($mayKeep -and [version]$now -lt [version]$before) { Write-Error "<Version> ${now} of $commit is below ${before} (parent $parent)"; exit 1 }
            if (-not $mayKeep -and [version]$now -le [version]$before) { Write-Error "<Version> ${now} of $commit is not above ${before} (parent $parent): enable the hooks (git config core.hooksPath .githooks)"; exit 1 }
          }
        }

    # A warning only: the release workflow stops on it. Not reachable metadata is no reason to fail a build.
    - name: SDK is the newest patch
      continue-on-error: true
      shell: pwsh
      run: ./scripts/check-sdk-current.ps1 -WarnOnly

    - name: Install .NET (version from global.json)
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Restore
      run: dotnet restore Tunero.sln --locked-mode

    - name: Build
      run: dotnet build Tunero.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test Tunero.sln --configuration Release --no-build --filter "Category!=Hardware" --logger "trx;LogFileName=results.trx" --results-directory TestResults

    # Artifacts count against the account's storage quota: a full quota must not fail the build.
    - name: Upload test results
      if: failure()
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: test-results
        path: TestResults
        if-no-files-found: ignore
        retention-days: 7

    - name: Publish single exe
      run: dotnet publish src/Optimizer.App -p:PublishProfile=SingleFile

    - name: Upload exe
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Tunero-${{ github.sha }}
        path: artifacts/publish/Tunero.exe
        if-no-files-found: error
        retention-days: 14
