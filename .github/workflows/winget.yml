# winget: when a release is published (the draft from release.yml turned into a release), submit its manifest to
# microsoft/winget-pkgs as package jozuern.Tunero with Microsoft's wingetcreate. wingetcreate copies the last
# manifest in winget-pkgs, puts in the new version, URL, SHA-256, date and release notes link, and opens the pull
# request from the token owner's fork. A volunteer moderator merges it; winget offers the version after that.
#
# The token is a classic personal access token with only the public_repo scope (wingetcreate supports no fine-grained
# token), stored as secret WINGET_CREATE_GITHUB_TOKEN of the environment "winget", which only v*.*.* tags may use.
# Of the project only scripts/verify-release.ps1 runs here (no build). To submit a release again (for example after a
# failed run): Actions > winget > Run workflow, "Use workflow from" the tag.
# wingetcreate is pinned to a release and its SHA-256; to update it, take both from
# gh api repos/microsoft/winget-create/releases/latest (asset wingetcreate.exe, field digest).

name: winget

on:
  release:
    types: [ released ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  submit:
    runs-on: windows-2025
    timeout-minutes: 20
    environment: winget

    env:
      TAG: ${{ github.ref_name }}
      WINGETCREATE_URL: https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe
      WINGETCREATE_SHA256: 24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea

    steps:
    - name: Release of a version tag
      shell: pwsh
      run: |
        if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { Write-Error "$env:TAG is not a version tag (v1.2.3)"; exit 1 }
        $release = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,publishedAt | ConvertFrom-Json
        if ($release.isDraft -or $release.isPrerelease) { Write-Error "$env:TAG is a draft or a pre-release"; exit 1 }
        "RELEASE_DATE=$(([datetime]$release.publishedAt).ToUniversalTime().ToString('yyyy-MM-dd'))" >> $env:GITHUB_ENV
      env:
        GH_TOKEN: ${{ github.token }}

    # wingetcreate hashes whatever Tunero.exe the release holds when it runs: an asset replaced after publishing
    # would reach winget users, who do not get the app's own update check. Only an exe that matches the release's
    # checksum, signed with the app's key for this version (the statement of UpdateSignature), is submitted.
    # scripts/verify-release.ps1, as in chocolatey.yml.
    - name: Checkout the update key and the release check
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        sparse-checkout: |
          src/Optimizer.Core/Updates/update-key*.pem
          scripts/verify-release.ps1
        sparse-checkout-cone-mode: false
        path: key
        persist-credentials: false

    - name: Verify the release assets
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir assets --pattern Tunero.exe --pattern Tunero.exe.sha256 --pattern Tunero.exe.sig
        if ($LASTEXITCODE -ne 0) { Write-Error "release assets not downloaded"; exit 1 }
        $hash = ./key/scripts/verify-release.ps1 -Version $env:TAG.TrimStart('v') -Folder assets -KeyFolder key/src/Optimizer.Core/Updates
        "Verified Tunero.exe SHA-256 $hash" | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
        "VERIFIED_SHA256=$hash" >> $env:GITHUB_ENV

    # wingetcreate update needs the package in winget-pkgs: the first version is submitted by hand
    # (scripts/winget-manifest.ps1), and until it is merged this job ends here without an error.
    - name: Package already in winget
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $out = gh api repos/microsoft/winget-pkgs/contents/manifests/j/jozuern/Tunero --silent 2>&1
        if ($LASTEXITCODE -eq 0) {
          "PUBLISHED=true" >> $env:GITHUB_ENV
        } elseif (($out -join "`n") -match 'HTTP 404') {
          "jozuern.Tunero is not in winget-pkgs yet: submit its first version with scripts/winget-manifest.ps1 (CONTRIBUTING, winget)." | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
          "PUBLISHED=false" >> $env:GITHUB_ENV
        } else {
          # Rate limit, outage or a token problem: not proof that the package is missing, so the run fails visibly.
          Write-Error "Could not check winget-pkgs: $($out -join ' ')"
          exit 1
        }
        # The pwsh shell of Actions ends the step with the last exit code: the expected 404 is no failure.
        $global:LASTEXITCODE = 0

    - name: Download wingetcreate
      if: env.PUBLISHED == 'true'
      shell: pwsh
      run: |
        Invoke-WebRequest $env:WINGETCREATE_URL -OutFile wingetcreate.exe
        $hash = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash
        if ($hash -ne $env:WINGETCREATE_SHA256) { Write-Error "wingetcreate.exe has SHA-256 $hash, expected $env:WINGETCREATE_SHA256"; exit 1 }

    # wingetcreate downloads the exe again and hashes that copy: the manifest is written first and submitted only when
    # its hash is the one verified above, so an asset replaced in between never reaches winget.
    - name: Submit the manifest
      if: env.PUBLISHED == 'true'
      shell: pwsh
      run: |
        $version = $env:TAG.Substring(1)
        $repo = "https://github.com/$env:GITHUB_REPOSITORY"
        .\wingetcreate.exe update jozuern.Tunero --version $version `
          --urls "$repo/releases/download/$env:TAG/Tunero.exe|x64" `
          --release-date $env:RELEASE_DATE --release-notes-url "$repo/releases/tag/$env:TAG" --out out
        if ($LASTEXITCODE -ne 0) { Write-Error "wingetcreate update failed ($LASTEXITCODE)"; exit 1 }
        $manifest = Get-ChildItem out/manifests -Recurse -Directory | Where-Object { $_.Name -eq $version } | Select-Object -First 1
        if (-not $manifest) { Write-Error "wingetcreate wrote no manifest for $version"; exit 1 }
        $hashes = Get-ChildItem $manifest.FullName -Filter *.installer.yaml | Get-Content |
          Select-String '^\s*InstallerSha256:\s*([0-9A-Fa-f]{64})\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value.ToLowerInvariant() }
        if (@($hashes).Count -eq 0 -or @($hashes | Where-Object { $_ -ne $env:VERIFIED_SHA256 }).Count -gt 0) {
          Write-Error "the manifest lists SHA-256 $($hashes -join ', '), the verified release exe has $env:VERIFIED_SHA256"; exit 1
        }
        .\wingetcreate.exe submit --prtitle "Update: jozuern.Tunero to $version" $manifest.FullName
        if ($LASTEXITCODE -ne 0) { Write-Error "wingetcreate submit failed ($LASTEXITCODE)"; exit 1 }
      env:
        WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
