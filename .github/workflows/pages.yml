# Builds the website in website/ (Astro and Svelte) and publishes it to GitHub Pages at https://tunero.dev.
# Runs when the site, the facts it reads (README counts, changelog, catalog, explanation pages, the checks' ratings, the
# app's strings) or this file change, after each release (so the version on the page follows the latest release), and on
# demand. It publishes only a commit that passed CI (the ci job below).
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'src/Optimizer.Core/Catalog/**'
      - 'src/Optimizer.Core/Findings/**'
      - 'src/Optimizer.App/Resources/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A run started by a release runs on its tag, and the github-pages environment deploys only from main. The release
  # commit reached main before the release existed, so that build still read the previous version: start a run on main.
  # (workflow_dispatch is one of the events GITHUB_TOKEN may start a run with.)
  dispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - name: Build again on main
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  # The site goes live only from a commit that passed "Build and test" (dotnet-desktop.yml, which runs on every push to
  # main and also checks the catalog and explanation pages the site reads). It waits for that run while it is going.
  ci:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
    - name: Build and test passed for this commit
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        id=
        for attempt in $(seq 1 20); do
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dotnet-desktop.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [ -n "$id" ] && break
          sleep 30
        done
        if [ -z "$id" ]; then echo "::error::No Build and test run for $GITHUB_SHA: the site is not published"; exit 1; fi
        gh run watch "$id" --repo "$GITHUB_REPOSITORY" --interval 30 > /dev/null || true
        conclusion=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
        if [ "$conclusion" != "success" ]; then echo "::error::Build and test ended with '$conclusion' for $GITHUB_SHA: the site is not published"; exit 1; fi
        echo "Build and test passed for $GITHUB_SHA (run $id)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: website/package-lock.json

    - name: Install
      working-directory: website
      run: npm ci --ignore-scripts --no-audit --no-fund

    - name: Test
      working-directory: website
      run: npm test

    - name: Build
      working-directory: website
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # reads the latest release for the version on the page
      run: npm run build # astro check, then astro build

    # The demo desktop in a browser (e2e/), against the site just built: windows, focus, the saved session, the guided
    # fix and the wallpaper's stills.
    - name: Install Chromium
      working-directory: website
      run: npx playwright install --with-deps chromium

    - name: Browser tests
      working-directory: website
      run: npm run test:e2e

    - name: Configure Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload site
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
