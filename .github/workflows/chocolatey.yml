# Chocolatey: when a release is published (the draft from release.yml turned into a release), build the package "tunero"
# with scripts/chocolatey-package.ps1 and push it to the Chocolatey community repository. A new package version is
# checked automatically (validator, verifier, VirusTotal); the first version of the package is also reviewed by a
# volunteer moderator, later ones usually not. choco offers the version once it is approved.
#
# The API key (chocolatey.org > Account > API Keys) is stored as secret CHOCOLATEY_API_KEY of the environment
# "chocolatey", which only v*.*.* tags may use. Of the project only scripts/verify-release.ps1 and
# scripts/chocolatey-package.ps1 run here (no build). To push a release again (for example after a failed run):
# Actions > chocolatey > Run workflow, "Use workflow from" the tag. A version that was pushed once cannot be pushed
# again; fix the package with a fourth version segment (0.8.0.20261013) instead.

name: chocolatey

on:
  release:
    types: [ released ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chocolatey-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: windows-2025
    timeout-minutes: 20
    environment: chocolatey

    env:
      TAG: ${{ github.ref_name }}

    steps:
    - name: Release of a version tag
      shell: pwsh
      run: |
        if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { Write-Error "$env:TAG is not a version tag (v1.2.3)"; exit 1 }
        $release = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease | ConvertFrom-Json
        if ($release.isDraft -or $release.isPrerelease) { Write-Error "$env:TAG is a draft or a pre-release"; exit 1 }
      env:
        GH_TOKEN: ${{ github.token }}

    # The package pins the exe's SHA-256: only an exe that matches the release's checksum, signed with the app's key for
    # this version (the statement of UpdateSignature), is packaged. scripts/verify-release.ps1, as in winget.yml.
    - name: Checkout the update key, the release check and the package script
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        sparse-checkout: |
          src/Optimizer.Core/Updates/update-key*.pem
          scripts/verify-release.ps1
          scripts/chocolatey-package.ps1
        sparse-checkout-cone-mode: false
        path: repo
        persist-credentials: false

    - name: Verify the release assets
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir assets --pattern Tunero.exe --pattern Tunero.exe.sha256 --pattern Tunero.exe.sig
        if ($LASTEXITCODE -ne 0) { Write-Error "release assets not downloaded"; exit 1 }
        $hash = ./repo/scripts/verify-release.ps1 -Version $env:TAG.TrimStart('v') -Folder assets -KeyFolder repo/src/Optimizer.Core/Updates
        "SHA256=$hash" >> $env:GITHUB_ENV
        "Verified Tunero.exe SHA-256 $hash" | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY

    - name: Build the package
      shell: pwsh
      run: |
        ./repo/scripts/chocolatey-package.ps1 -Version $env:TAG.Substring(1) -OutDir out -Sha256 $env:SHA256
        $package = Get-ChildItem out -Filter 'tunero.*.nupkg' | Select-Object -First 1
        if (-not $package) { Write-Error "no package was built"; exit 1 }
        "PACKAGE=$($package.FullName)" >> $env:GITHUB_ENV

    - name: Push to the community repository
      shell: pwsh
      run: |
        $out = choco push $env:PACKAGE --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY 2>&1
        $code = $LASTEXITCODE
        $out | Write-Host
        if ($code -ne 0) {
          # Chocolatey refuses (403) every new version while the package has a version in moderation and none approved
          # (docs.chocolatey.org, Common Errors). That is the first version waiting for review, not a broken release.
          $approved = choco search tunero --exact --limit-output --source https://community.chocolatey.org/api/v2/
          if (($out -join "`n") -match '403' -and -not $approved) {
            "Not pushed: Chocolatey takes a new version only after the first version of tunero is approved. Once it is, run this workflow by hand for $env:TAG (Actions > chocolatey > Run workflow)." | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
            "::notice::Chocolatey: the first version of tunero is still in moderation, $env:TAG was not pushed"
            $global:LASTEXITCODE = 0
            exit 0
          }
          Write-Error "choco push failed ($code)"; exit 1
        }
        "Pushed $(Split-Path -Leaf $env:PACKAGE): https://community.chocolatey.org/packages/tunero" | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
      env:
        CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
