# Installs, tests and builds the website in website-v2/ on pull requests, as pages.yml does before it publishes: a
# dependency update that breaks the site (TypeScript 7 for astro check) fails here, before it reaches main. Publishes
# nothing.
name: Website check

on:
  pull_request:
    branches: [main]
    paths:
      - 'website-v2/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'src/Optimizer.Core/Catalog/**'
      - 'src/Optimizer.Core/Findings/**'
      - 'src/Optimizer.App/Resources/**'
      - '.github/workflows/website-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: website-v2/package-lock.json

    - name: Install
      working-directory: website-v2
      run: npm ci --ignore-scripts --no-audit --no-fund

    - name: Test
      working-directory: website-v2
      run: npm test

    # No token: a pull request from Dependabot or a fork gets none, and the build falls back to the changelog's version.
    - name: Build
      working-directory: website-v2
      run: npm run build # astro check, then astro build

    # The demo desktop in a browser (e2e/), against the site just built: windows, focus, the saved session, the guided
    # fix and the wallpaper's stills.
    - name: Install Chromium
      working-directory: website-v2
      run: npx playwright install --with-deps chromium

    - name: Browser tests
      working-directory: website-v2
      run: npm run test:e2e

    - name: Upload browser test traces
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: browser-test-traces
        path: website-v2/test-results
        retention-days: 7
